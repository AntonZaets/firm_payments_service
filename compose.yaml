services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firm_payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
      POSTGRES_DB: ${POSTGRES_DB:-firm_payments}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://firm_payments:local-development@db:5432/firm_payments}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELOAD: "true"
      UV_PROJECT_ENVIRONMENT: /app/.venv
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./firm_payments_service:/app/firm_payments_service
      - ./tests:/app/tests
      - ./db_migrations:/app/db_migrations
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml:ro
      - ./:/workspace
      - pre_commit_cache:/root/.cache/pre-commit
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 30

volumes:
  postgres_data:
  pre_commit_cache:
