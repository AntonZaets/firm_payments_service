services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firm_payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
      POSTGRES_DB: ${POSTGRES_DB:-firm_payments}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    image: postgres:18.6
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-firm_payments}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development}
      PGDATABASE: ${POSTGRES_DB:-firm_payments}
    command: [psql, -v, ON_ERROR_STOP=1, -f, /local/bootstrap.sql]
    volumes:
      - ./local/bootstrap.sql:/local/bootstrap.sql:ro
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-development}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./local/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping', timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: [dex, serve, /etc/dex/config.yaml]
    volumes:
      - ./local/dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    command: [sh, -c, "uv run --locked alembic upgrade head && exec uv run --locked python -m firm_payments_service"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://firm_payments:local-development@db:5432/firm_payments}
      OPERATIONAL_API_KEY: ${OPERATIONAL_API_KEY:-local-operational-key}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:5556/dex}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-firm-payments}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://dex:5556/dex/keys}
      AUTH_JWKS_TIMEOUT_SECONDS: ${AUTH_JWKS_TIMEOUT_SECONDS:-30}
      AUTH_TOKEN_PROFILE: ${AUTH_TOKEN_PROFILE:-dex}
      AUTH_ALLOW_HTTP: ${AUTH_ALLOW_HTTP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELOAD: "true"
      UV_PROJECT_ENVIRONMENT: /app/.venv
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      dex:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./firm_payments_service:/app/firm_payments_service
      - ./tests:/app/tests
      - ./local:/app/local:ro
      - ./db_migrations:/app/db_migrations
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./alembic.ini:/app/alembic.ini:ro
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health/ready', headers={'X-API-Key': os.environ['OPERATIONAL_API_KEY']}); urllib.request.urlopen(request, timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 30

volumes:
  postgres_data:
  pgadmin_data:
